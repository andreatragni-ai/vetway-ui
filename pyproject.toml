[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vetway-ui"
version = "0.1.0"
description = "Strato grafico condiviso delle applicazioni Vetway (CSS, JS, template base, partial, template tag)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = ["Django>=5.1,<6"]

[tool.setuptools]
packages = ["vetway_ui", "vetway_ui.templatetags"]
include-package-data = true
